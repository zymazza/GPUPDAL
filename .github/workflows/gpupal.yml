                  PDG_REQUIRE_CUDA_HYBRID=1 \
                  "$GITHUB_WORKSPACE/build/pdg-cuda-release/bin/gpupal" \
                  pipeline pipeline.json --metadata metadata.json
              )
            done
          done
      - name: CUDA shared spatial-index integration sanitizers
        run: |
          for pipeline in \
            hybrid-outlier-radius hybrid-outlier-statistical hybrid-normal \
            hybrid-radialdensity \
            hybrid-eigenvalues hybrid-covariancefeatures \
            hybrid-covariancefeatures-extended-sqrt \
            hybrid-approximatecoplanar \
            hybrid-approximatecoplanar-max \
            hybrid-approximatecoplanar-ties \
            hybrid-approximatecoplanar-boundary \
            hybrid-approximatecoplanar-zero \
            hybrid-approximatecoplanar-resident \
            hybrid-neighborhood-resident \
            hybrid-neighborhood-column-consumer \
            hybrid-nndistance-resident; do
            for tool in memcheck initcheck racecheck synccheck; do
              run_dir="$(mktemp -d)"
              if [ "$pipeline" = hybrid-outlier-radius ] || \
                 [ "$pipeline" = hybrid-radialdensity ] || \
                 [ "$pipeline" = hybrid-approximatecoplanar-ties ]; then
                cp test/data/pdg/neighborhood-points.csv "$run_dir/input.csv"
              elif [ "$pipeline" = hybrid-approximatecoplanar-boundary ] || \
                   [ "$pipeline" = hybrid-approximatecoplanar-zero ]; then
                cp test/data/pdg/approximatecoplanar-boundary.csv \
                  "$run_dir/input.csv"
              else
                cp test/data/las/simple.las "$run_dir/input.las"
              fi
              if [ "$pipeline" = hybrid-approximatecoplanar ]; then
                spatial_backend=PDG_FORCE_UNIFORM_GRID=1
              else
                spatial_backend=PDG_FORCE_MORTON_BVH=1
              fi
              extra_guards=()
              if [ "$pipeline" = hybrid-approximatecoplanar-ties ]; then
                extra_guards+=(PDG_REQUIRE_NEIGHBORHOOD_TIE_REPAIR=1)
              fi
              cp "test/data/pdg/$pipeline.json" "$run_dir/pipeline.json"
              (
                cd "$run_dir"
                compute-sanitizer --tool "$tool" --error-exitcode=99 \
                  env PDG_DISABLE_NATIVE=1 PDG_REQUIRE_HYBRID=1 \
                  PDG_REQUIRE_CUDA_HYBRID=1 \
                  PDG_REQUIRE_NEIGHBORHOOD_REUSE=1 \
                  PDG_REQUIRE_NEIGHBORHOOD_COLUMN_REUSE=1 \
                  PDG_REQUIRE_NEIGHBORHOOD_COPLANAR_COLUMN_REUSE=1 \
                  PDG_REQUIRE_NEIGHBORHOOD_EIGENSYSTEM_REUSE=8 \
                  PDG_SPATIAL_TILE_EDGE=2 \
                  PDG_REQUIRE_SPATIAL_TILING=1 \
                  "$spatial_backend" \
                  "${extra_guards[@]}" \
                  "$GITHUB_WORKSPACE/build/pdg-cuda-release/bin/gpupal" \
                  pipeline pipeline.json
              )
            done
          done
      - name: Exact CUDA CLI differential
        env:
          PDG_REQUIRE_CUDA_TRANSLATE: "1"
        run: >-
          python3 scripts/pdg/differential.py
          --oracle build/pdg-cuda-release/bin/pdal
          --candidate build/pdg-cuda-release/bin/gpupal
          --case gpu-native-simple
          --work-dir build/pdg-cuda-release/tests/differential
          --frozen-time-library
          build/pdg-cuda-release/lib/libpdg_frozen_time.so
          -- translate ${{ github.workspace }}/test/data/las/simple.las out.las
      - name: Exact CUDA fused point-program differential
        env:
          PDG_REQUIRE_CUDA_POINT_PROGRAM: "1"
        run: >-
          python3 scripts/pdg/differential.py
          --oracle build/pdg-cuda-release/bin/pdal
          --candidate build/pdg-cuda-release/bin/gpupal
          --case gpu-native-assign-ferry-fused
          --work-dir build/pdg-cuda-release/tests/differential
          --frozen-time-library
          build/pdg-cuda-release/lib/libpdg_frozen_time.so
          --seed-file input.las=${{ github.workspace }}/test/data/las/simple.las
          --seed-file pipeline.json=${{ github.workspace }}/test/data/pdg/assign-ferry-fused.json
          -- pipeline pipeline.json
