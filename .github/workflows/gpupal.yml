name: GPUPAL

on:
  pull_request:
    paths:
      - ".github/workflows/gpupal.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/pdg/**"
      - "packages/npm/**"
      - "scripts/pdg/**"
      - "src/**"
      - "tests/**"
  push:
    branches: [main, gpu-main]
  workflow_dispatch:
    inputs:
      gpu_runtime:
        description: "Run tests on the self-hosted RTX 4090 runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpupal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format cmake g++ libcurl4-openssl-dev libgdal-dev \
            libgeotiff-dev liblzma-dev libproj-dev libsqlite3-dev \
            libxml2-dev libzstd-dev ninja-build python3 zlib1g-dev
      - name: Check generated dimensions
        run: python3 scripts/pdg/generate_dimensions.py --check
      - name: Test npm installer scaffold
        run: npm test --prefix packages/npm
      - name: Check C++ formatting
        run: >-
          find include/pdg src tests/unit -type f
          \( -name '*.hpp' -o -name '*.cpp' -o -name '*.cu' \)
          ! -path '*/generated/*' -print0 |
          xargs -0 clang-format --dry-run --Werror
      - name: Configure
        run: cmake --preset pdg-host-debug
      - name: Build
        run: cmake --build --preset pdg-host-debug
      - name: Unit tests
        run: ctest --preset pdg-host-debug
      - name: Build pinned oracle and differential support
        run: cmake --build build/pdg-host-debug --target pdg_differential_prerequisites
      - name: Exact fallback differential tests
        run: ctest --test-dir build/pdg-host-debug -L differential --output-on-failure

  upstream-pdal-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libcurl4-openssl-dev libgdal-dev libgeotiff-dev \
            liblzma-dev libproj-dev libsqlite3-dev libxml2-dev \
            libzstd-dev ninja-build python3 zlib1g-dev
      - name: Configure published PDAL tests
        run: cmake --preset pdal-upstream-tests
      - name: Build published PDAL tests
        run: cmake --build --preset pdal-upstream-tests
      - name: Run published PDAL tests sequentially
        run: ctest --preset pdal-upstream-tests

  host-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libcurl4-openssl-dev libgdal-dev libgeotiff-dev \
            liblzma-dev libproj-dev libsqlite3-dev libxml2-dev \
            libzstd-dev ninja-build python3 zlib1g-dev
      - name: Configure
        run: cmake --preset pdg-host-sanitize
      - name: Build with leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: >-
          cmake --build build/pdg-host-sanitize --target
          pdg_cli pdg_unit_tests pdg_check_dimensions
          pdg_differential_prerequisites
      - name: ASan and UBSan tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build/pdg-host-sanitize -L pdg --output-on-failure
      - name: Exact ordinal process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/ordinal_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact locate process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/locate_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact transformation process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/transformation_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact robust-statistics process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/robust_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact ordering process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/ordering_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact Morton process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/morton_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact groupby process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/groupby_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact returns and merge process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/returns_merge_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
            --candidate-preload "$asan_library"
      - name: Exact divider and splitter process matrix under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          asan_library="$(g++ -print-file-name=libasan.so)"
          python3 tests/differential/divider_splitter_matrix.py \
            --oracle build/pdg-host-sanitize/bin/pdal \
            --candidate build/pdg-host-sanitize/bin/gpupal \
            --differential scripts/pdg/differential.py \
            --fixture-root test/data \
            --work-dir build/pdg-host-sanitize/tests/differential \
            --frozen-time-library \
              build/pdg-host-sanitize/lib/libpdg_frozen_time.so \
            --oracle-preload "$asan_library" \
